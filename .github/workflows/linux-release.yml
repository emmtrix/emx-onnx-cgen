name: linux-release

on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload release asset"
        required: false
        default: "false"
  release:
    types: [published]

jobs:
  build-linux-bundle:
    runs-on: ubuntu-latest
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64
    env:
      # Created by the "Set up release Python" step.
      PYTHON_BIN: /opt/release-venv/bin/python
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: dnf install -y gcc gcc-c++ make

      # Both release bundles are built with the same pinned python-build-standalone
      # CPython (tools/release_python.json), so they ship the same interpreter and
      # libraries. The manylinux image's own Python only runs the download script.
      - name: Set up release Python
        run: |
          python="$(/opt/python/cp312-cp312/bin/python3 tools/fetch_release_python.py \
            --platform linux-amd64 --dest /opt/release-python)"
          "$python" -m venv /opt/release-venv
          "$PYTHON_BIN" --version

      - name: Install dependencies
        run: |
          "$PYTHON_BIN" -m pip install --upgrade pip
          "$PYTHON_BIN" -m pip install -r requirements-ci.txt
          "$PYTHON_BIN" -m pip install pyinstaller

      - name: Build and package PyInstaller bundle
        run: |
          if [[ -f tools/build_linux_pyinstaller_release.sh ]]; then
            bash tools/build_linux_pyinstaller_release.sh
          else
            "$PYTHON_BIN" tools/pyinstaller_build.py
            tar -czf emx-onnx-cgen-linux-amd64.tar.gz -C dist emx-onnx-cgen
          fi

      - name: Generate SBOM
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            release=(--release-tag "${GITHUB_REF_NAME}")
          else
            release=(--version "0.0.0.dev0+g${GITHUB_SHA::12}")
          fi
          "$PYTHON_BIN" tools/generate_sbom.py bundle \
            --workpath build/emx-onnx-cgen \
            --platform linux-amd64 \
            --artifact emx-onnx-cgen-linux-amd64.tar.gz \
            --output emx-onnx-cgen-linux-amd64.cdx.json \
            --python-build tools/release_python.json \
            "${release[@]}"

      - name: Upload workflow artifact
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: emx-onnx-cgen-linux-amd64
          path: |
            emx-onnx-cgen-linux-amd64.tar.gz
            emx-onnx-cgen-linux-amd64.cdx.json

      - name: Upload release asset
        if: ${{ github.event_name == 'release' }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            emx-onnx-cgen-linux-amd64.tar.gz
            emx-onnx-cgen-linux-amd64.cdx.json
