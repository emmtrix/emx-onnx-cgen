name: windows-release

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build-windows-bundle:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -q -r requirements-ci.txt
          python -m pip install pyinstaller
          
      - name: Build PyInstaller bundle
        run: |
          python tools/pyinstaller_build.py

      - name: Zip bundle
        run: |
          Compress-Archive -Path dist/emx-onnx-cgen/* -DestinationPath emx-onnx-cgen-windows-amd64.zip

      - name: Generate SBOM
        run: |
          $release = if ($env:GITHUB_REF_TYPE -eq "tag") {
            @("--release-tag", $env:GITHUB_REF_NAME)
          } else {
            @("--version", "0.0.0.dev0+g$($env:GITHUB_SHA.Substring(0, 12))")
          }
          python tools/generate_sbom.py bundle `
            --workpath build/emx-onnx-cgen `
            --platform windows-amd64 `
            --artifact emx-onnx-cgen-windows-amd64.zip `
            --output emx-onnx-cgen-windows-amd64.cdx.json `
            @release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload workflow artifact
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: emx-onnx-cgen-windows-amd64
          path: |
            emx-onnx-cgen-windows-amd64.zip
            emx-onnx-cgen-windows-amd64.cdx.json

      - name: Upload release asset
        if: ${{ github.event_name == 'release' }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            emx-onnx-cgen-windows-amd64.zip
            emx-onnx-cgen-windows-amd64.cdx.json
