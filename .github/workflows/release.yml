name: release

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      # contents: write attaches the wheel SBOM to the GitHub release.
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            export SETUPTOOLS_SCM_PRETEND_VERSION="${GITHUB_REF_NAME#v}"
          fi
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      # Describes the wheel just published, in the dependency versions pip
      # resolves for it in a fresh environment.
      - name: Generate wheel SBOM
        run: |
          python -m venv sbom-venv
          sbom-venv/bin/python -m pip install dist/*.whl packaging
          sbom-venv/bin/python tools/generate_sbom.py wheel \
            --artifact dist/*.whl \
            --output emx-onnx-cgen-wheel.cdx.json

      - name: Upload wheel SBOM
        if: ${{ github.event_name == 'release' }}
        uses: softprops/action-gh-release@v2
        with:
          files: emx-onnx-cgen-wheel.cdx.json
