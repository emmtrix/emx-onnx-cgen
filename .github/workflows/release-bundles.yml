name: release-bundles

# Builds both platform bundles in one run from the same commit, combines them
# into emx-onnx-cgen-bundles.tar.gz with one SBOM, and attaches all of them to
# the GitHub release.
on:
  workflow_dispatch:
  release:
    types: [published]
  # TEMPORARY: test run on the PR branch; workflow_dispatch needs the file on main.
  push:
    branches: [release/combined-bundle]

jobs:
  linux:
    uses: ./.github/workflows/linux-release.yml

  windows:
    uses: ./.github/workflows/windows-release.yml

  combine:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Download platform bundles
        uses: actions/download-artifact@v4
        with:
          pattern: emx-onnx-cgen-*-amd64
          merge-multiple: true

      - name: Combine bundles
        run: |
          python -m pip install packaging
          python tools/combine_release_bundles.py \
            --linux emx-onnx-cgen-linux-amd64.tar.gz \
            --windows emx-onnx-cgen-windows-amd64.zip \
            --output emx-onnx-cgen-bundles.tar.gz
          release=()
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            release=(--release-tag "${GITHUB_REF_NAME}")
          fi
          python tools/generate_sbom.py combine \
            --input emx-onnx-cgen-linux-amd64.cdx.json \
            --input emx-onnx-cgen-windows-amd64.cdx.json \
            --artifact emx-onnx-cgen-bundles.tar.gz \
            --output emx-onnx-cgen-bundles.cdx.json \
            "${release[@]}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: emx-onnx-cgen-bundles
          path: |
            emx-onnx-cgen-bundles.tar.gz
            emx-onnx-cgen-bundles.cdx.json

      - name: Upload release assets
        if: ${{ github.event_name == 'release' }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            emx-onnx-cgen-linux-amd64.tar.gz
            emx-onnx-cgen-linux-amd64.cdx.json
            emx-onnx-cgen-windows-amd64.zip
            emx-onnx-cgen-windows-amd64.cdx.json
            emx-onnx-cgen-bundles.tar.gz
            emx-onnx-cgen-bundles.cdx.json
